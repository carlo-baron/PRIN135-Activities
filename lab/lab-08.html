<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
	<h1>Checkout</h1>
		<section>
			<h2>Your Cart</h2>
			<img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Rubiks Cube">
		</section>
		<section>
			<h2>Payment Information</h2>
			<form>
				<label for="card-name">
					Card Name
					<span aria-hidden="true">*</span>
				</label>
				<input id="card-name" type="text" name="card-name" required>
				<label for="card-number">
					Card Number
					<span aria-hidden="true">*</span>
				</label>
				<input id="card-number" aria-describedby="card-number-help" type="text" name="card-number" required>
				<p id="card-number-help">
					Enter credit card details.
				</p>

			</form>
		</section>
</body>

</html>
